<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValueCalc - 인플루언서 광고 단가 계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Mobile UI Container -->
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-gray-200">
        
        <!-- Header -->
        <div class="p-6 border-b border-gray-200 flex justify-between items-center bg-gray-50">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">ValueCalc</h1>
                <p class="text-sm text-gray-500 mt-1">Influencer Ad Rate Calculator</p>
            </div>
            <svg class="w-8 h-8 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
            </svg>
        </div>

        <form id="calcForm" class="p-6 space-y-6">
            
            <!-- 1. Campaign Details -->
            <div>
                <h2 class="text-lg font-semibold text-gray-800 mb-4">1. Campaign Details</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Select Platform</label>
                        <select id="platform" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="instagram">Instagram</option>
                            <option value="youtube">YouTube</option>
                            <option value="tiktok">TikTok</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Followers Count</label>
                        <input type="number" id="followers" placeholder="e.g., 250000" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
            </div>

            <!-- Average Engagement -->
            <div>
                <h3 class="text-sm font-semibold text-gray-700 mb-3 bg-gray-100 p-2 rounded">Average Engagement (Recent 10 posts)</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Average Likes</label>
                        <input type="number" id="likes" placeholder="e.g., 12500" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Average Comments</label>
                        <input type="number" id="comments" placeholder="e.g., 450" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
            </div>

            <!-- 2. Content Options -->
            <div>
                <h2 class="text-lg font-semibold text-gray-800 mb-4">2. Content Options</h2>
                <div class="space-y-3">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="opt-video" value="1.3" class="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                        <span class="text-gray-700 font-medium">Reel / Video (x1.3)</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="opt-image" value="1.0" checked class="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                        <span class="text-gray-700 font-medium">Standard Post (x1.0)</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="opt-license" value="1.5" class="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                        <span class="text-gray-700 font-medium">2nd Licensing Rights (x1.5)</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="opt-rush" value="1.2" class="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                        <span class="text-gray-700 font-medium">Rush Delivery (x1.2)</span>
                    </label>
                </div>
            </div>

            <button type="button" onclick="calculateRate()" class="w-full bg-black text-white font-semibold py-3 rounded-xl hover:bg-gray-800 transition-colors">
                Calculate Rate
            </button>
        </form>

        <!-- Results Section -->
        <div id="resultsArea" class="hidden border-t border-gray-200 bg-gray-50 p-6 text-center">
            <h2 class="text-lg font-bold text-gray-800">Estimated Ad Rate</h2>
            <div id="priceRange" class="text-4xl font-extrabold text-black mt-3 mb-2">₩0 - ₩0</div>
            
            <p id="erDisplay" class="text-sm text-gray-500 mb-5">Engagement Rate: 0%</p>
            
            <button class="w-full flex items-center justify-center space-x-2 bg-white border border-gray-300 text-gray-800 font-semibold py-3 rounded-xl hover:bg-gray-100 transition-colors shadow-sm">
                <span>Download Report</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        function calculateRate() {
            const followers = parseFloat(document.getElementById('followers').value);
            const likes = parseFloat(document.getElementById('likes').value);
            const comments = parseFloat(document.getElementById('comments').value);
            
            if (!followers || !likes) {
                alert("Please enter valid numbers for Followers and Likes.");
                return;
            }

            // 1. Base Rate (예: 팔로워당 10원)
            const baseRate = followers * 10;

            // 2. Engagement Rate (ER)
            const er = ((likes + (comments || 0)) / followers) * 100;
            
            // 플랫폼 평균 2% 가정. 1% 초과마다 10% 할증, 미달 시 20%까지 할인
            let erModifier = 1.0;
            if (er > 2.0) {
                const extra = Math.floor(er - 2.0);
                erModifier += (extra * 0.1); 
            } else if (er < 1.0) {
                erModifier = 0.8;
            }

            // 3. Option Multipliers
            let optionMultiplier = 1.0;
            if (document.getElementById('opt-video').checked) optionMultiplier *= parseFloat(document.getElementById('opt-video').value);
            if (document.getElementById('opt-license').checked) optionMultiplier *= parseFloat(document.getElementById('opt-license').value);
            if (document.getElementById('opt-rush').checked) optionMultiplier *= parseFloat(document.getElementById('opt-rush').value);

            // 4. Final Calculation
            const targetRate = baseRate * erModifier * optionMultiplier;
            const minRate = Math.floor(targetRate * 0.85); // 15% 오차 하한
            const maxRate = Math.floor(targetRate * 1.15); // 15% 오차 상한

            // Display formatting (KRW)
            const formatter = new Intl.NumberFormat('ko-KR');
            document.getElementById('priceRange').innerText = `₩${formatter.format(minRate)} - ₩${formatter.format(maxRate)}`;
            document.getElementById('erDisplay').innerText = `Engagement Rate: ${er.toFixed(2)}% (Modifier: x${erModifier.toFixed(2)})`;
            
            // Show Results Area
            document.getElementById('resultsArea').classList.remove('hidden');
            
            // Scroll to bottom softly
            document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
